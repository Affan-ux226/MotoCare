    <script>
      (function() {
        try {
          var saved = localStorage.getItem('motocare_theme_mode_v2');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
