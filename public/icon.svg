<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D10" />
      <stop offset="50%" stop-color="#15191E" />
      <stop offset="100%" stop-color="#0B0D10" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1677FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1677FF" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#1E252D" stroke-width="4" />

  <!-- Accent glow circle -->
  <circle cx="256" cy="256" r="160" fill="#1677FF" opacity="0.08" filter="blur(30px)" />

  <!-- Motorbike Icon Graphic -->
  <g filter="url(#glow)" transform="translate(64, 88)">
    <!-- Back wheel -->
    <circle cx="80" cy="240" r="56" fill="none" stroke="#3B82F6" stroke-width="18" />
    <circle cx="80" cy="240" r="24" fill="#15191E" stroke="#60A5FA" stroke-width="8" />

    <!-- Front wheel -->
    <circle cx="304" cy="240" r="56" fill="none" stroke="#3B82F6" stroke-width="18" />
    <circle cx="304" cy="240" r="24" fill="#15191E" stroke="#60A5FA" stroke-width="8" />

    <!-- Frame & Body -->
    <path d="M 80 240 L 140 160 L 220 160 L 260 210 L 304 240" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 140 160 L 190 240 L 304 240" fill="none" stroke="#60A5FA" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Fuel Tank & Seat -->
    <path d="M 120 160 Q 140 135 180 135 L 220 135 Q 240 135 245 155 L 210 165 Z" fill="url(#primaryGrad)" />
    <path d="M 90 165 C 100 155, 120 155, 140 160 L 130 175 Z" fill="#475569" />

    <!-- Handlebars & Fork -->
    <path d="M 230 120 L 260 85 L 245 80" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 260 85 L 304 240" fill="none" stroke="#93C5FD" stroke-width="14" stroke-linecap="round" />

    <!-- Headlight beam glow -->
    <polygon points="265,95 340,105 340,135 260,115" fill="#38BDF8" opacity="0.4" />
    <circle cx="265" cy="105" r="8" fill="#F8FAFC" />
  </g>

  <!-- Badge Text -->
  <text x="256" y="440" font-family="'Prompt', -apple-system, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    MOTOCARE
  </text>
  <circle cx="370" cy="428" r="5" fill="#1677FF" />
</svg>
